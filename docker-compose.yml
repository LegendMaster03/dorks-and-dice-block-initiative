    container_name: dorks-and-dice-block-initiative
    restart: unless-stopped
    environment:
      ToolHost__BaseUrl: "http://dorks-and-dice-site:8080"
    networks:
      - dorks-and-dice-backend

networks:
  dorks-and-dice-backend:
    external: true
